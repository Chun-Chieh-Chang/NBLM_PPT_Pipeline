<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBLM PPT Pipeline - 專案儀錶板</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Injected Navigation Bar -->
  <div id="navbar-container"></div>

  <!-- Main Container -->
  <main class="container">
    
    <!-- Dashboard Header -->
    <div class="dashboard-header">
      <div>
        <h1 style="font-family: var(--font-title); font-size: 32px; font-weight: 800;">PPT 投影片流水線儀錶板</h1>
        <p style="color: var(--secondary-text); margin-top: 4px; font-size: 15px;">
          管理、編輯並一鍵將素材與 Google NotebookLM 資源轉換為微軟原生 DrawingML 簡報。
        </p>
      </div>
      <button class="btn btn-primary" onclick="openCreateModal()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        建立新專案
      </button>
    </div>

    <!-- Stats summary grid -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 32px;">
      <div class="card" style="padding: 20px;">
        <h3 style="color: var(--secondary-text); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;">活躍專案總數</h3>
        <p id="stats-total" style="font-family: var(--font-title); font-size: 36px; font-weight: 800; color: var(--accent); margin-top: 8px;">0</p>
      </div>
      <div class="card" style="padding: 20px;">
        <h3 style="color: var(--secondary-text); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;">已匯出簡報</h3>
        <p id="stats-exported" style="font-family: var(--font-title); font-size: 36px; font-weight: 800; color: var(--success); margin-top: 8px;">0</p>
      </div>
      <div class="card" style="padding: 20px;">
        <h3 style="color: var(--secondary-text); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em;">SkillsBuilder 狀態</h3>
        <div id="stats-skills" style="margin-top: 12px;" class="status-indicator">
          <span class="status-dot inactive"></span>
          <span style="font-size: 14px; font-weight: 600; color: var(--secondary-text);">偵測中...</span>
        </div>
      </div>
    </div>

    <!-- Project List Grid -->
    <h2 style="font-family: var(--font-title); font-size: 22px; margin-bottom: 16px;">所有簡報專案</h2>
    <div id="project-list" class="project-grid">
      <!-- Loading Placeholder -->
      <div style="grid-column: 1 / -1; text-align: center; padding: 64px 0; color: var(--secondary-text);">
        <svg class="nav-logo" style="width: 48px; height: 48px; margin: 0 auto 16px; animation: spin 2s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17" />
        </svg>
        <p style="font-size: 16px; font-weight: 500;">正在讀取專案列表...</p>
      </div>
    </div>

  </main>

  <!-- Create Project Modal Dialog -->
  <div id="create-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 0;">初始化新簡報專案</h2>
        <button class="modal-close" onclick="closeCreateModal()">&times;</button>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="project-name">專案名稱</label>
        <input type="text" id="project-name" class="form-input" placeholder="例如: study_guide_slides" required>
        <p class="settings-help">系統會自動在名稱後方追加日期字尾（格式如 _YYYYMMDD）</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="project-format">畫布比例格式 (Canvas Format)</label>
        <select id="project-format" class="form-select">
          <option value="ppt169">PowerPoint 寬螢幕 16:9 (1280×720)</option>
          <option value="ppt43">PowerPoint 傳統 4:3 (1024×768)</option>
          <option value="xiaohongshu">小紅書手機卡片 3:4 (1242×1660)</option>
          <option value="wechat">微信公眾號首圖 2.35:1 (900×383)</option>
          <option value="moments">正方形圖卡 1:1 (1080×1080)</option>
          <option value="a4">A4 印刷尺寸 (1240×1754)</option>
          <option value="guizang_magazine">Guizang 電子雜誌風 (HTML 網頁簡報)</option>
          <option value="guizang_swiss">Guizang 瑞士國際主義 (HTML 網頁簡報)</option>
        </select>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeCreateModal()">取消</button>
        <button class="btn btn-primary" onclick="submitCreateProject()">
          <svg id="btn-create-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
          確認建立
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>NBLM PPT Pipeline © 2026 PPT Master Engine & SkillsBuilder Developer. All rights reserved.</p>
  </footer>

  <script src="/static/js/shared.js"></script>
  <script src="/static/js/dashboard.js?v=2.7.1"></script>

  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
